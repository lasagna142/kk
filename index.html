<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Review Tracker</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap">
<style>
/* Layout: one column. Subjects stack top to bottom; each card lists what is overdue (red) or nearly due (yellow). */
:root {
  --bg: #09090b; --surface: #131316; --ink: #f4f4f5; --muted: #a1a1aa; --line: #27272c;
  --accent: #f4f4f5; --accent-ink: #09090b; --accent-soft: #1c1c21;
  --late: #ff6b6b; --late-soft: #3a1416; --soon: #fbbf24; --soon-soft: #33260a;
  --done: #4ade80; --danger: #ff6b6b;
  --font: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.5; }
.shell { display: block; }
.calpane { position: fixed; z-index: 44; left: 0; top: 0; bottom: 0; width: min(460px, 92vw); background: var(--bg); border-right: 1px solid var(--line); padding: 16px; overflow: auto; display: flex; flex-direction: column; gap: 12px; transform: translateX(-100%); transition: transform .25s ease; visibility: hidden; }
body.calopen .calpane { transform: none; visibility: visible; }
#calBack { position: fixed; inset: 0; z-index: 43; background: rgba(0,0,0,.6); display: none; }
body.calopen #calBack { display: block; }
#calToggle { position: fixed; z-index: 45; left: 0; top: 50%; transform: translateY(-50%); width: 28px; height: 64px; border: 1px solid var(--line); border-left: 0; border-radius: 0 12px 12px 0; background: var(--surface); color: var(--ink); font-size: 1.25rem; padding: 0; transition: left .25s ease; }
body.calopen #calToggle { left: min(460px, 92vw); }
.wrap { max-width: 760px; margin: 0 auto; padding: 20px 20px 56px 40px; display: flex; flex-direction: column; gap: 16px; }
.wrap > * { flex: none; }
.wrap > header h1, header h1 { flex: 1 1 auto; }
.acc { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 4px 12px; }
.acch2 { display: flex; align-items: center; gap: 8px; }
.acch { flex: 1; width: 100%; background: none; border: 0; text-align: left; font-weight: 700; font-size: 1rem; min-height: 44px; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 0; }
.acch .cnt { color: var(--muted); font-weight: 500; margin-left: 6px; }
.acch .chev { color: var(--muted); }
.accb { display: flex; flex-direction: column; gap: 6px; padding: 4px 0 10px; }
.pick { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.pickrow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.calhead { display: flex; align-items: center; gap: 8px; }
.calhead .ttl { flex: 1; font-size: 1.1rem; font-weight: 800; margin: 0; }
.calbtn { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; min-height: 34px; min-width: 34px; padding: 2px 10px; font-weight: 600; font-size: .875rem; }
.calgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; flex: 1; grid-auto-rows: minmax(64px, 1fr); }
.calwd { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; color: var(--muted); font-size: .75rem; font-weight: 600; text-align: center; }
.cday { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 4px; display: flex; flex-direction: column; gap: 3px; align-items: stretch; text-align: left; overflow: hidden; min-width: 0; }
.cday.blank { background: transparent; border-color: transparent; cursor: default; }
.cday:not(.blank):hover { border-color: var(--muted); }
.cday .dn { font-size: .75rem; font-weight: 600; color: var(--muted); }
.cday.today { border-color: var(--ink); }
.cday.today .dn { color: var(--ink); font-weight: 800; }
.chips { display: flex; flex-wrap: wrap; gap: 3px; }
.chip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .6875rem; font-weight: 700; border-radius: 6px; padding: 0 6px; background: #2a2a31; color: var(--ink); line-height: 1.5; }
.chip.late { background: var(--late-soft); color: var(--late); }
.chip.soon { background: var(--soon-soft); color: var(--soon); }
.code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-weight: 700; font-size: .8125rem; border: 1px solid var(--line); background: var(--bg); color: var(--muted); border-radius: 6px; padding: 0 7px; white-space: nowrap; }
.dlg { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.7); display: flex; align-items: center; justify-content: center; padding: 16px; }
.dlgbox { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; width: min(520px, 100%); max-height: 85vh; overflow: auto; display: flex; flex-direction: column; gap: 14px; }
.dlgbox h2 { margin: 0; font-size: 1.25rem; font-weight: 800; }
.dsub { display: flex; flex-direction: column; gap: 6px; }
.dsub .dsh { background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 1.0625rem; display: flex; gap: 8px; align-items: center; }
.dtop { display: flex; justify-content: space-between; gap: 8px; border-radius: 8px; padding: 6px 10px; background: var(--bg); border: 1px solid var(--line); font-weight: 500; }
.dtop.late { background: var(--late-soft); color: var(--late); border-color: transparent; }
.dtop.soon { background: var(--soon-soft); color: var(--soon); border-color: transparent; }
.dtop .rd { font-size: .8125rem; opacity: .85; white-space: nowrap; }
header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.75rem; margin: 0; font-weight: 800; text-wrap: balance; min-width: 0; flex: 1; overflow-wrap: anywhere; }
.status { font-size: .75rem; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.back { background: none; border: 0; color: var(--accent); font-weight: 600; padding: 6px 0; }
.addrow { display: flex; gap: 8px; flex-wrap: wrap; }
.addrow input[type=text] { flex: 1 1 200px; min-width: 0; }
input[type=text], input[type=date] { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; }
.btn { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 600; min-height: 44px; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); font-weight: 500; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .9375rem; }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); }
.btn.filebtn { display: inline-flex; align-items: center; cursor: pointer; }
.linkdanger { background: none; border: 0; color: var(--danger); font-weight: 600; padding: 6px 0; }
.scard { cursor: pointer; }
.scard:hover { border-color: var(--accent); }
.hrow { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.scard { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.scard .name { font-weight: 800; font-size: 1.3125rem; overflow-wrap: anywhere; display: flex; gap: 10px; align-items: center; }
.scard .meta { color: var(--muted); font-size: .875rem; }
.rems { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rem { display: flex; gap: 4px 12px; align-items: baseline; justify-content: space-between; flex-wrap: wrap; border-radius: 10px; padding: 8px 10px; font-size: .9375rem; }
.rem .due { font-size: .8125rem; opacity: .9; }
.cd { font-variant-numeric: tabular-nums; font-weight: 700; margin-left: 6px; }
.rem.late { background: var(--late-soft); color: var(--late); }
.rem.soon { background: var(--soon-soft); color: var(--soon); }
.rem .tag { font-weight: 700; font-size: .8125rem; white-space: nowrap; }
.rem .what { color: inherit; font-weight: 500; overflow-wrap: anywhere; min-width: 0; }
.rem .round { font-size: .875rem; }
.ok { color: var(--done); font-weight: 600; font-size: .9375rem; }
.more { color: var(--muted); font-size: .875rem; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.sp { flex: 1; }
.tabs { display: flex; gap: 8px; }
.tab { flex: 1; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; font-weight: 600; min-height: 44px; }
.tab.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.topic { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
.topic-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.topic-title { font-weight: 600; font-size: 1.0625rem; overflow-wrap: anywhere; min-width: 0; }
.topic-date { color: var(--muted); font-size: .8125rem; }
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.step { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; min-width: 0; border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; background: var(--bg); cursor: pointer; }
.step.late { border-color: var(--late); background: var(--late-soft); }
.step.soon { border-color: var(--soon); background: var(--soon-soft); }
.step.done { border-color: var(--done); }
.step input { width: 22px; height: 22px; accent-color: var(--accent); margin: 0; }
.step .lbl { font-weight: 700; font-size: .9375rem; }
.step .when { font-size: .75rem; color: var(--muted); }
.step.late .when { color: var(--late); font-weight: 600; }
.step.soon .when { color: var(--soon); font-weight: 600; }
.step.done .when { color: var(--done); }
.empty { border: 1px dashed var(--line); border-radius: 14px; padding: 24px 16px; color: var(--muted); text-align: center; }
.note { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: .9375rem; }
.note.warn { background: var(--soon-soft); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
.shot { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.shot .thumb { border: 0; padding: 0; background: var(--bg); display: block; width: 100%; aspect-ratio: 1; }
.shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
.shot .cap { font-size: .75rem; color: var(--muted); padding: 6px 8px 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.shot .acts { padding: 6px 8px 8px; display: flex; gap: 6px; flex-wrap: wrap; }
.viewer { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.88); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.viewer img { max-width: 100%; max-height: 100%; object-fit: contain; }
.sec { display: flex; flex-direction: column; gap: 10px; }
.sec h2 { font-size: 1.125rem; margin: 0; font-weight: 800; }
.sec .hint { color: var(--muted); font-size: .875rem; }
.files { display: flex; flex-direction: column; gap: 6px; }
.frow { display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 4px 10px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; }
.ficon { width: 44px; height: 44px; border-radius: 8px; background: var(--bg); display: flex; align-items: center; justify-content: center; font-size: .6875rem; font-weight: 700; color: var(--muted); overflow: hidden; border: 0; padding: 0; }
.ficon img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fname { font-weight: 600; overflow-wrap: anywhere; }
.fmeta { color: var(--muted); font-size: .8125rem; }
.facts { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; }
.tgroup { font-weight: 600; margin-top: 6px; overflow-wrap: anywhere; }
select { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px; flex: 1 1 200px; min-width: 0; color: var(--ink); font: inherit; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 2px; }
.gthumb { padding: 0; border: 0; background: var(--surface); aspect-ratio: 1; display: block; cursor: pointer; overflow: hidden; }
.gthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vbtn { position: fixed; background: rgba(0,0,0,.65); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 10px 16px; font-weight: 600; min-height: 44px; min-width: 44px; z-index: 60; }
.vbtn.nav { top: 50%; transform: translateY(-50%); font-size: 1.25rem; }
.vtop { top: max(12px, env(safe-area-inset-top, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); }
.vcount { position: fixed; top: max(20px, env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); color: #fff; z-index: 60; font-size: .875rem; }
.vbottom { position: fixed; bottom: max(14px, env(safe-area-inset-bottom, 0px)); left: 0; right: 0; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; z-index: 60; padding: 0 16px; }
.vbottom .vbtn { position: static; }
@media (max-width: 460px) { .steps { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<div class="shell"><aside class="calpane" id="cal" aria-label="Calendar"></aside><div id="calBack"></div><button id="calToggle" aria-label="Calendar">›</button><main class="wrap" id="app"></main></div>

<script>
(function () {
  var INTERVALS = [
    { key: "d1",  label: "24h", ms: 24 * 3600e3 },
    { key: "d3",  label: "3d",  ms: 3 * 24 * 3600e3 },
    { key: "d7",  label: "7d",  ms: 7 * 24 * 3600e3 },
    { key: "d21", label: "21d", ms: 21 * 24 * 3600e3 }
  ];
  var SOON_MS = 24 * 3600e3;      // yellow when a review is due within the next 24 hours
  var MAX_REMS = 6;               // reminders shown per subject card before "+N more"
  var LS_KEY = "review-tracker-v1";
  var state = { subjects: [] };
  var view = { open: {}, subjectId: null, tab: "topics", confirm: null, pending: null, msg: null, viewer: null, gconfirm: false, libTopic: "" };
  var app = document.getElementById("app");

  var COLL = (typeof Intl !== "undefined" && Intl.Collator) ? new Intl.Collator(["th", "en"], { numeric: true, sensitivity: "base" }) : { compare: function (a, b) { return a < b ? -1 : a > b ? 1 : 0; } };
  function byName(a, b) { return COLL.compare(a.name, b.name); }
  function sortedSubjects() { return state.subjects.slice().sort(byName); }
  function codeOf(id) { var l = sortedSubjects(); for (var i = 0; i < l.length; i++) if (l[i].id === id) return String(i + 1).padStart(3, "0"); return ""; }
  function pad2(n) { return n < 10 ? "0" + n : "" + n; }
  function clock(ms) { var t = Math.max(0, Math.floor(ms / 1000)); return pad2(Math.floor(t / 3600)) + ":" + pad2(Math.floor(t % 3600 / 60)) + ":" + pad2(t % 60); }
  function dkey(ts) { var d = new Date(ts); return d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate(); }
  var cal = { y: new Date().getFullYear(), m: new Date().getMonth(), day: null };
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function uid() { return Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4); }
  function fmt(ts) { var d = new Date(ts); return pad2(d.getDate()) + "/" + pad2(d.getMonth() + 1); }
  function isConfirm(v) { v = String(v).trim().toLowerCase(); return v === "confirm" || v === "ยืนยัน"; }
  function todayStr() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function stampFor(dateStr) {
    if (!dateStr || dateStr === todayStr()) return Date.now();
    var p = dateStr.split("-"); return new Date(+p[0], +p[1] - 1, +p[2], 8, 0).getTime();
  }
  function span(ms) {
    var h = Math.round(ms / 3600e3);
    if (h < 1) return "ไม่ถึง 1 ชม.";
    if (h < 48) return h + " ชม.";
    return Math.round(ms / 86400e3) + " วัน";
  }

  // ---------- text storage ----------
  function normalize(o) { return o && Array.isArray(o.subjects) ? o : { subjects: [] }; }
  function lsRead() { try { return normalize(JSON.parse(localStorage.getItem(LS_KEY))); } catch (e) { return { subjects: [] }; } }
  function persist() { try { localStorage.setItem(LS_KEY, JSON.stringify(state)); } catch (e) { view.msg = { text: "Could not save (browser storage full or blocked). Try Export.", warn: true }; } }

  // ---------- image storage (IndexedDB) ----------
  var idb = null, STORE = "imgs";
  function openDb() {
    return new Promise(function (res) {
      try {
        var r = indexedDB.open("review-lib", 1);
        r.onupgradeneeded = function () { r.result.createObjectStore(STORE, { keyPath: "id" }).createIndex("subjectId", "subjectId"); };
        r.onsuccess = function () { res(r.result); };
        r.onerror = function () { res(null); };
      } catch (e) { res(null); }
    });
  }
  function store(mode) { return idb.transaction(STORE, mode).objectStore(STORE); }
  function rp(rq) { return new Promise(function (res, rej) { rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { rej(rq.error); }; }); }
  function imgList(sid) { return rp(store("readonly").index("subjectId").getAll(sid)); }
  function imgAll() { return rp(store("readonly").getAll()); }
  function imgPut(rec) { return rp(store("readwrite").put(rec)); }
  function imgDel(id) { return rp(store("readwrite").delete(id)); }
  function imgClear() { return rp(store("readwrite").clear()); }
  function imgDelSubject(sid) {
    if (!idb) return Promise.resolve();
    return imgList(sid).then(function (list) { return Promise.all(list.map(function (r) { return imgDel(r.id); })); }).catch(function () {});
  }
  function shrink(file) {
    return new Promise(function (res) {
      var url = URL.createObjectURL(file), im = new Image();
      im.onload = function () {
        var k = Math.min(1, 1600 / Math.max(im.naturalWidth, im.naturalHeight));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.naturalWidth * k)); c.height = Math.max(1, Math.round(im.naturalHeight * k));
        var g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        c.toBlob(function (b) { URL.revokeObjectURL(url); res(b || file); }, "image/jpeg", 0.85);
      };
      im.onerror = function () { URL.revokeObjectURL(url); res(file); };
      im.src = url;
    });
  }
  function blobToDataUrl(b) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.onerror = rej; r.readAsDataURL(b); }); }

  // ---------- reminders ----------
  // One entry per topic: red if any review is overdue, otherwise yellow if one is due within SOON_MS.
  function topicRem(t) {
    var now = Date.now(), late = null, soon = null;
    INTERVALS.forEach(function (iv) {
      if (t.checks[iv.key]) return;
      var due = t.at + iv.ms, diff = due - now;
      if (diff <= 0) { if (!late || due < late.due) late = { due: due }; }
      else if (diff <= SOON_MS) { if (!soon || due < soon.due) soon = { due: due }; }
    });
    var pick = late || soon;
    return pick ? { t: t, late: !!late, due: pick.due } : null;
  }
  // yellow first (soonest on top), then red (least overdue first)
  function remCmp(a, b) { if (a.late !== b.late) return a.late ? 1 : -1; return a.late ? b.due - a.due : a.due - b.due; }
  function reminders(subject) {
    return subject.topics.map(topicRem).filter(Boolean).sort(remCmp);
  }
  function displaySubjects() {
    var codes = {}; sortedSubjects().forEach(function (x, i) { codes[x.id] = String(i + 1).padStart(3, "0"); });
    return state.subjects.map(function (x) { var r = reminders(x); return { s: x, code: codes[x.id], rems: r, rank: r[0] || null }; }).sort(function (a, b) {
      if (a.rank && b.rank) return remCmp(a.rank, b.rank);
      if (a.rank) return -1; if (b.rank) return 1;
      return byName(a.s, b.s);
    });
  }
  // every unchecked review round, grouped by the local day it falls due
  function dueByDay() {
    var now = Date.now(), map = {};
    state.subjects.forEach(function (s) {
      s.topics.forEach(function (t) {
        INTERVALS.forEach(function (iv) {
          if (t.checks[iv.key]) return;
          var due = t.at + iv.ms, diff = due - now, k = dkey(due);
          (map[k] = map[k] || []).push({ s: s, t: t, label: iv.label, due: due, st: diff <= 0 ? "late" : diff <= SOON_MS ? "soon" : "" });
        });
      });
    });
    return map;
  }
  function subj(id) { return state.subjects.filter(function (s) { return s.id === id; })[0]; }
  function countTopics(st) { return st.subjects.reduce(function (n, s) { return n + s.topics.length; }, 0); }

  // ---------- backup / restore ----------
  function cleanState(o) {
    if (!o || !Array.isArray(o.subjects)) return null;
    var out = { subjects: [] };
    for (var i = 0; i < o.subjects.length; i++) {
      var s = o.subjects[i];
      if (!s || typeof s.name !== "string") return null;
      var subject = { id: typeof s.id === "string" ? s.id : uid(), name: s.name.slice(0, 80), topics: [] };
      var topics = Array.isArray(s.topics) ? s.topics : [];
      for (var j = 0; j < topics.length; j++) {
        var t = topics[j];
        if (!t || typeof t.title !== "string") return null;

  var SEL = "[data-tog],[data-attach],[data-unattach],[data-topics],[data-home],[data-askdelt],[data-delt],[data-askdels],[data-dels],[data-cancel],[data-export],[data-doimport],[data-cancelimport],[data-closeviewer],[data-askdelimg],[data-delimg],[data-openf],[data-dl],[data-uptopic],[data-imgs],[data-gview],[data-gprev],[data-gnext],[data-gdelask],[data-gdelno],[data-gdel]";
  app.addEventListener("click", function (e) {
    var el = e.target.closest(SEL);
    if (!el) return;
    var d = el.dataset, keepMsg = d.export || d.doimport || d.cancelimport;
    if (!keepMsg) { view.msg = null; view.pending = null; }
    if (d.export) { view.pending = null; exportFile(); return; }
    if (d.doimport) { applyImport(); return; }
    if (d.cancelimport) view.pending = null;
    else if (d.topics) { view.subjectId = d.topics; view.tab = "topics"; view.confirm = null; view.viewer = null; }
    else if (d.tog) { view.open[d.tog] = !view.open[d.tog]; var bd = app.querySelector('[data-body="' + d.tog + '"]'); if (bd) bd.hidden = !view.open[d.tog]; return; }
    else if (d.attach || d.unattach) {
      var ap = (d.attach || d.unattach).split("|"), rec = libCache[ap[0]]; if (!rec) return;
      var go = function () { rec.topicId = d.attach ? ap[1] : null; if (d.attach) view.open["t:" + ap[1]] = true; imgPut(rec).catch(function () {}).then(render); };
      if (d.attach) go(); else confirmDlg("Move this file back to Storage?", "Move", go);
      return;
    }
    else if (d.home) { view.subjectId = null; view.confirm = null; view.viewer = null; }
    else if (d.askdelt) { var tid0 = d.askdelt; confirmDlg("Delete this topic and its files?", "Delete", function () { var s0 = subj(view.subjectId); if (!s0) return; s0.topics = s0.topics.filter(function (t) { return t.id !== tid0; }); persist(); delTopicFiles(s0.id, tid0).then(render); }); return; }
    else if (d.askdels) view.confirm = "s:" + d.askdels;
    else if (d.askdelimg) { var iid0 = d.askdelimg; confirmDlg("Delete this file?", "Delete", function () { imgDel(iid0).catch(function () {}).then(render); }); return; }
    else if (d.cancel) view.confirm = null;
    else if (d.openf) { openFile(d.openf); return; }
    else if (d.dl) { downloadFile(d.dl); return; }
    else if (d.uptopic) {
      var sel = document.getElementById("libTopic");
      if (!sel || !sel.value) { view.msg = { text: "เลือกหัวข้อก่อนอัปโหลดไฟล์ในส่วนไฟล์ตามหัวข้อ", warn: true }; }
      else { var fi = document.getElementById("libFileTopic"); if (fi) fi.click(); return; }
    }
    else if (d.imgs) { view.subjectId = d.imgs; view.tab = "imgs"; view.confirm = null; view.viewer = null; view.gconfirm = false; }
    else if (d.gview) { view.viewer = d.gview; view.gconfirm = false; showViewer(); return; }
    else if (d.gprev || d.gnext) { var gi = gOrder.indexOf(view.viewer) + (d.gnext ? 1 : -1); if (gOrder[gi]) { view.viewer = gOrder[gi]; view.gconfirm = false; showViewer(); } return; }
    else if (d.gdelask) {
      confirmDlg("Delete this photo?", "Delete", function () {
        var gid = view.viewer, gj = gOrder.indexOf(gid);
        view.viewer = gOrder[gj + 1] || gOrder[gj - 1] || null; if (view.viewer === gid) view.viewer = null; view.gconfirm = false;
        imgDel(gid).catch(function () {}).then(render);
      }); return;
    }
    else if (d.gdelno) { view.gconfirm = false; showViewer(); return; }
    else if (d.gdel) {
      var gid = view.viewer, gj = gOrder.indexOf(gid);
      view.viewer = gOrder[gj + 1] || gOrder[gj - 1] || null; if (view.viewer === gid) view.viewer = null; view.gconfirm = false;
      imgDel(gid).catch(function () {}).then(render); return;
    }
    else if (d.closeviewer) { view.viewer = null; view.gconfirm = false; var gv = document.getElementById("gviewer"); if (gv) gv.remove(); return; }
    else if (d.delimg) { view.confirm = null; imgDel(d.delimg).catch(function () {}).then(render); return; }
    else if (d.delt) { var s = subj(view.subjectId); s.topics = s.topics.filter(function (t) { return t.id !== d.delt; }); view.confirm = null; persist(); delTopicFiles(s.id, d.delt); }
    else if (d.dels) {
      var box = document.getElementById("delConfirm");
      if (!box || !isConfirm(box.value)) return;
      var sid = d.dels;
      state.subjects = state.subjects.filter(function (x) { return x.id !== sid; });
      view.subjectId = null; view.confirm = null; persist();
      imgDelSubject(sid);
    }
    render();
  });
  app.addEventListener("change", function (e) {
    var t = e.target;
    if (t.id === "importFile") { if (t.files && t.files[0]) readImport(t.files[0]); return; }
    if (t.id === "imgFile") { if (t.files && t.files.length && view.subjectId) addImages(t.files, view.subjectId); return; }
    if (t.id && t.id.indexOf("tf-") === 0) { if (t.files && t.files.length && view.subjectId) { view.open["t:" + t.id.slice(3)] = true; addFiles(t.files, view.subjectId, t.id.slice(3)); } return; }
    if (t.id === "libTopic") { view.libTopic = t.value; return; }
    if (t.id === "libFileGen") { if (t.files && t.files.length && view.subjectId) addFiles(t.files, view.subjectId, null); return; }
    if (t.id === "libFileTopic") { if (t.files && t.files.length && view.subjectId && view.libTopic) addFiles(t.files, view.subjectId, view.libTopic); return; }
    var c = t.getAttribute && t.getAttribute("data-check");
    if (!c) return;
    var p = c.split("|"), s = subj(view.subjectId); if (!s) return;
    var tp = s.topics.filter(function (x) { return x.id === p[0]; })[0]; if (!tp) return;
    if (t.checked) tp.checks[p[1]] = Date.now(); else delete tp.checks[p[1]];
    persist(); render();
  });
  app.addEventListener("input", function (e) {
    if (e.target.id === "delConfirm") { var go = document.getElementById("delGo"); if (go) go.disabled = !isConfirm(e.target.value); }
  });
  app.addEventListener("keydown", function (e) {
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("scard")) { e.preventDefault(); e.target.click(); }
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.getElementById("cfm")) { document.getElementById("cfm").remove(); return; }
    if (e.key === "Escape" && document.getElementById("daydlg")) { showDay(null); return; }
    if (!view.viewer) return;
    if (e.key === "Escape") { view.viewer = null; view.gconfirm = false; var gv = document.getElementById("gviewer"); if (gv) gv.remove(); }
    else if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
      var gi = gOrder.indexOf(view.viewer) + (e.key === "ArrowRight" ? 1 : -1);
      if (gOrder[gi]) { view.viewer = gOrder[gi]; view.gconfirm = false; showViewer(); }
    }
  });

  document.addEventListener("click", function (e) {
    var el = e.target.closest("[data-calnav],[data-day],[data-dayclose],[data-gosub]"); if (!el) return;
    var d = el.dataset;
    if (d.calnav) {
      if (d.calnav === "today") { var n = new Date(); cal.y = n.getFullYear(); cal.m = n.getMonth(); }
      else { var m = cal.m + (+d.calnav); cal.y += Math.floor(m / 12); cal.m = (m % 12 + 12) % 12; }
      renderCal();
    } else if (d.day) showDay(d.day);
    else if (d.dayclose) { if (d.dayclose === "bg" && e.target !== el) return; showDay(null); }
    else if (d.gosub) { showDay(null); view.subjectId = d.gosub; view.tab = "topics"; view.confirm = null; view.viewer = null; view.msg = null; render(); }
  });
  document.getElementById("calToggle").addEventListener("click", function () {
    var o = document.body.classList.toggle("calopen"); this.textContent = o ? "‹" : "›";
  });
  document.getElementById("calBack").addEventListener("click", function () { document.body.classList.remove("calopen"); document.getElementById("calToggle").textContent = "›"; });
  setInterval(function () {
    var nodes = document.querySelectorAll("[data-cd]"), expired = false, now = Date.now();
    nodes.forEach(function (n) { var ms = +n.getAttribute("data-cd") - now; if (ms <= 0) expired = true; else n.textContent = clock(ms); });
    if (expired && !document.getElementById("daydlg") && !view.viewer) { var a = document.activeElement; if (!(a && a.tagName === "INPUT" && a.type === "text")) render(); }
  }, 1000);

  // ---------- boot ----------
  state = lsRead();
  render();
  openDb().then(function (db) { idb = db; if (view.subjectId) render(); });
})();
</script>
</body>
</html>
